<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mako Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base:    #080c18;
    --bg-surface: #0e1425;
    --bg-panel:   #111828;
    --bg-hover:   #1a2038;
    --border:     #1e2840;
    --accent:     #00e5cc;
    --accent-dim: #00a896;
    --accent-glow:rgba(0,229,204,0.18);
    --text:       #dde6f5;
    --text-muted: #5a6a88;
    --text-dim:   #8899bb;
    --red:        #ff5566;
    --green:      #00e599;
    --yellow:     #ffd166;
    --purple:     #b388ff;
    --orange:     #ff9966;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-base);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Topbar ──────────────────────────────────────────────── */
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    height: 52px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.3px;
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent-glow);
    flex-shrink: 0;
  }
  .logo svg { width: 26px; height: 26px; }

  .sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

  #filename-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
  }
  #filename {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 6px;
    outline: none;
    transition: border-color .2s, background .2s;
    width: 220px;
  }
  #filename:focus {
    border-color: var(--border);
    background: var(--bg-panel);
    color: var(--text);
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    transition: all .15s;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover {
    background: var(--bg-hover);
    color: var(--text);
    border-color: #2e3a58;
  }
  .btn-run {
    background: linear-gradient(135deg, #00e5cc, #0096ff);
    color: #000;
    font-weight: 600;
    box-shadow: 0 0 18px rgba(0,229,204,.25);
  }
  .btn-run:hover {
    box-shadow: 0 0 28px rgba(0,229,204,.4);
    transform: translateY(-1px);
  }
  .btn-run:active { transform: translateY(0); }
  .btn-run.running {
    background: linear-gradient(135deg, #1a3a35, #1a3055);
    color: var(--accent);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }

  .kbd {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    color: rgba(0,0,0,0.6);
    background: rgba(0,0,0,0.15);
    padding: 2px 5px;
    border-radius: 3px;
  }

  /* ── Main layout ─────────────────────────────────────────── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Editor pane ─────────────────────────────────────────── */
  #editor-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    border-right: 1px solid var(--border);
  }

  #editor-header {
    display: flex;
    align-items: center;
    padding: 0 16px;
    height: 36px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    gap: 8px;
    flex-shrink: 0;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 6px 6px 0 0;
    font-size: 12px;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
  }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
    background: var(--bg-surface);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .dot.modified { background: var(--yellow); }

  #monaco-container {
    flex: 1;
    overflow: hidden;
  }

  /* ── Output pane ─────────────────────────────────────────── */
  #output-pane {
    width: 400px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-panel);
  }

  #output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    height: 36px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #output-header span {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  #clear-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color .15s;
  }
  #clear-btn:hover { color: var(--text); }

  #output {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
  }
  #output::-webkit-scrollbar { width: 4px; }
  #output::-webkit-scrollbar-track { background: transparent; }
  #output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .out-line { display: flex; gap: 8px; }
  .out-prefix { color: var(--text-muted); user-select: none; flex-shrink: 0; }
  .out-text { color: var(--text); white-space: pre-wrap; word-break: break-all; }
  .out-error .out-prefix { color: var(--red); }
  .out-error .out-text   { color: var(--red); }
  .out-info .out-prefix  { color: var(--accent); }
  .out-info .out-text    { color: var(--text-dim); font-style: italic; }

  .out-separator {
    height: 1px;
    background: var(--border);
    margin: 10px 0;
  }

  .exec-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .exec-badge.ok  { background: rgba(0,229,153,.12); color: var(--green); }
  .exec-badge.err { background: rgba(255,85,102,.12); color: var(--red); }

  /* ── Status bar ──────────────────────────────────────────── */
  #statusbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    height: 26px;
    background: var(--bg-surface);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  #status-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }
  .status-dot.idle { background: var(--text-muted); box-shadow: none; }
  .status-dot.running { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: pulse 1s infinite; }
  .status-dot.error { background: var(--red); box-shadow: 0 0 6px var(--red); }
  #status-text { color: var(--text-dim); }
  #cursor-pos { margin-left: auto; }

  /* ── Resizer ─────────────────────────────────────────────── */
  #resizer {
    width: 4px;
    background: var(--border);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background .15s;
  }
  #resizer:hover, #resizer.active { background: var(--accent-dim); }

  /* ── Scrollbar for Monaco ────────────────────────────────── */
  .monaco-editor .scrollbar.vertical .slider { background: var(--border) !important; }
</style>
</head>
<body>

<!-- ── Top bar ─────────────────────────────────────────────── -->
<div id="topbar">
  <div class="logo">
    <svg viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 55 C15 20, 30 10, 50 30 C70 50, 85 20, 95 5" stroke="#00e5cc" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="50" cy="30" r="5" fill="#00e5cc"/>
    </svg>
    Mako Studio
  </div>
  <div class="sep"></div>
  <div id="filename-wrap">
    <input id="filename" type="text" value="untitled.mako" spellcheck="false"/>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost" onclick="openFile()" title="Open file">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1"/>
        <path d="M13 14.5V19m0 0l-2-2m2 2l2-2M9 19H7a2 2 0 01-2-2v-4a2 2 0 012-2h10a2 2 0 012 2v4a2 2 0 01-2 2h-2"/>
      </svg>
      Open
    </button>
    <button class="btn btn-ghost" onclick="saveFile()" title="Save file (Ctrl+S)">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
      </svg>
      Save
    </button>
    <div class="sep"></div>
    <button class="btn btn-run" id="run-btn" onclick="runCode()" title="Run (Ctrl+Enter)">
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24" id="run-icon">
        <path d="M8 5v14l11-7z"/>
      </svg>
      Run
      <span class="kbd">Ctrl ↵</span>
    </button>
  </div>
</div>

<!-- ── Main ─────────────────────────────────────────────────── -->
<div id="main">
  <!-- Editor -->
  <div id="editor-pane">
    <div id="editor-header">
      <div class="tab active">
        <div class="dot" id="modified-dot"></div>
        <span id="tab-filename">untitled.mako</span>
      </div>
    </div>
    <div id="monaco-container"></div>
  </div>

  <!-- Resizer -->
  <div id="resizer"></div>

  <!-- Output -->
  <div id="output-pane">
    <div id="output-header">
      <span>Output</span>
      <button id="clear-btn" onclick="clearOutput()">Clear</button>
    </div>
    <div id="output">
      <div class="out-line out-info">
        <span class="out-prefix">✦</span>
        <span class="out-text">Mako Studio ready. Press Ctrl+Enter to run.</span>
      </div>
    </div>
  </div>
</div>

<!-- ── Status bar ────────────────────────────────────────────── -->
<div id="statusbar">
  <div id="status-indicator">
    <div class="status-dot idle" id="status-dot"></div>
    <span id="status-text">Ready</span>
  </div>
  <span>Mako v0.1.0</span>
  <span id="cursor-pos">Ln 1, Col 1</span>
</div>

<!-- Monaco Editor loader -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
// ── Monaco setup ─────────────────────────────────────────────

require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });

require(['vs/editor/editor.main'], function() {

  // Register Mako language
  monaco.languages.register({ id: 'mako' });

  monaco.languages.setMonarchTokensProvider('mako', {
    keywords: [
      'fn','give','if','elif','else','for','while','in','stop','skip',
      'begin','end','const','type','use','try','catch','throw','match',
      'case','and','or','not','true','false','nothing','self'
    ],
    tokenizer: {
      root: [
        [/#.*$/, 'comment'],
        [/say!|ask!/, 'keyword.special'],
        [/"([^"\\]|\\.)*"/, 'string'],
        [/\d+(\.\d+)?/, 'number'],
        [/!(?=[a-zA-Z_])/, 'variable.decl'],
        [/[a-zA-Z_]\w*/, { cases: {
          '@keywords': 'keyword',
          '@default': 'identifier'
        }}],
        [/==|!=|<=|>=|[<>]/, 'operator.relational'],
        [/[+\-*\/=]/, 'operator'],
        [/[\[\](){},.:]+/, 'delimiter'],
        [/\s+/, 'white'],
      ]
    }
  });

  monaco.languages.setLanguageConfiguration('mako', {
    comments: { lineComment: '#' },
    brackets: [['[',']'],['(',')']],
    autoClosingPairs: [
      { open: '[', close: ']' },
      { open: '(', close: ')' },
      { open: '"', close: '"' },
    ],
    surroundingPairs: [
      { open: '[', close: ']' },
      { open: '(', close: ')' },
      { open: '"', close: '"' },
    ]
  });

  // Define Mako theme
  monaco.editor.defineTheme('mako-dark', {
    base: 'vs-dark',
    inherit: true,
    rules: [
      { token: 'comment',           foreground: '3d5070', fontStyle: 'italic' },
      { token: 'keyword',           foreground: '00e5cc', fontStyle: 'bold' },
      { token: 'keyword.special',   foreground: 'ff9966', fontStyle: 'bold' },
      { token: 'string',            foreground: 'ffd166' },
      { token: 'number',            foreground: 'b388ff' },
      { token: 'variable.decl',     foreground: '00e5cc', fontStyle: 'bold' },
      { token: 'identifier',        foreground: 'dde6f5' },
      { token: 'operator',          foreground: '8899bb' },
      { token: 'operator.relational', foreground: '00b8a9' },
      { token: 'delimiter',         foreground: '5a6a88' },
    ],
    colors: {
      'editor.background':            '#080c18',
      'editor.foreground':            '#dde6f5',
      'editor.lineHighlightBackground':'#0e1425',
      'editor.selectionBackground':   '#00e5cc22',
      'editor.inactiveSelectionBackground': '#00e5cc11',
      'editorLineNumber.foreground':  '#1e2840',
      'editorLineNumber.activeForeground': '#3d5070',
      'editorCursor.foreground':      '#00e5cc',
      'editorIndentGuide.background': '#1a2038',
      'editorIndentGuide.activeBackground': '#2a3060',
      'editor.findMatchBackground':   '#00e5cc33',
      'editor.findMatchHighlightBackground': '#00e5cc18',
      'scrollbarSlider.background':   '#1e284066',
      'scrollbarSlider.hoverBackground': '#2a304060',
      'scrollbarSlider.activeBackground': '#2a304080',
      'editorBracketMatch.background': '#00e5cc15',
      'editorBracketMatch.border':    '#00e5cc66',
    }
  });

  const defaultCode = `fn greet(name) begin
    give "Hello, {name}! 🌊"
end

!message = greet("World")
say! message

!nums = [1, 2, 3, 4, 5]
!total = 0
for n in nums begin
    total = total + n
end
say! "Sum of {nums} = {total}"
`;

  window.editor = monaco.editor.create(document.getElementById('monaco-container'), {
    value: defaultCode,
    language: 'mako',
    theme: 'mako-dark',
    fontFamily: 'JetBrains Mono, Consolas, monospace',
    fontSize: 14,
    lineHeight: 22,
    fontLigatures: true,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    padding: { top: 16, bottom: 16 },
    renderWhitespace: 'selection',
    cursorBlinking: 'smooth',
    cursorSmoothCaretAnimation: 'on',
    smoothScrolling: true,
    bracketPairColorization: { enabled: true },
    guides: { indentation: true },
    tabSize: 4,
    insertSpaces: true,
    wordWrap: 'on',
    lineNumbers: 'on',
    glyphMargin: false,
    folding: true,
    automaticLayout: true,
    'semanticHighlighting.enabled': true,
  });

  // Update cursor position in status bar
  window.editor.onDidChangeCursorPosition(e => {
    document.getElementById('cursor-pos').textContent =
      `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
  });

  // Track modifications
  let isModified = false;
  window.editor.onDidChangeModelContent(() => {
    if (!isModified) {
      isModified = true;
      document.getElementById('modified-dot').classList.add('modified');
    }
  });
  window.isModified = { get: () => isModified, clear: () => { isModified = false; document.getElementById('modified-dot').classList.remove('modified'); } };

  // Ctrl+Enter to run
  window.editor.addCommand(
    monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter,
    () => runCode()
  );

  // Ctrl+S to save
  window.editor.addCommand(
    monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS,
    () => saveFile()
  );

  // Resize Monaco when window resizes
  window.addEventListener('resize', () => window.editor.layout());

  setStatus('idle', 'Ready');
});

// ── Resizer ───────────────────────────────────────────────────

const resizer = document.getElementById('resizer');
const outputPane = document.getElementById('output-pane');
let isResizing = false, startX = 0, startWidth = 0;

resizer.addEventListener('mousedown', e => {
  isResizing = true;
  startX = e.clientX;
  startWidth = outputPane.offsetWidth;
  resizer.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', e => {
  if (!isResizing) return;
  const delta = startX - e.clientX;
  const newWidth = Math.max(220, Math.min(700, startWidth + delta));
  outputPane.style.width = newWidth + 'px';
  if (window.editor) window.editor.layout();
});

document.addEventListener('mouseup', () => {
  isResizing = false;
  resizer.classList.remove('active');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

// ── Status helpers ────────────────────────────────────────────

function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  dot.className = 'status-dot ' + state;
  statusText.textContent = text;
}

// ── Output helpers ────────────────────────────────────────────

function appendOutput(text, cls = '') {
  const out = document.getElementById('output');
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line && lines.indexOf(line) === lines.length - 1) continue;
    const div = document.createElement('div');
    div.className = 'out-line ' + cls;
    div.innerHTML = `<span class="out-prefix">${cls === 'out-error' ? '✖' : '›'}</span><span class="out-text">${escHtml(line)}</span>`;
    out.appendChild(div);
  }
  out.scrollTop = out.scrollHeight;
}

function appendSeparator() {
  const out = document.getElementById('output');
  const div = document.createElement('div');
  div.className = 'out-separator';
  out.appendChild(div);
}

function clearOutput() {
  document.getElementById('output').innerHTML = '';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Run code ──────────────────────────────────────────────────

async function runCode() {
  if (!window.editor) return;

  const code = window.editor.getValue();
  const btn = document.getElementById('run-btn');
  const icon = document.getElementById('run-icon');

  btn.classList.add('running');
  icon.innerHTML = '<circle cx="12" cy="12" r="5" fill="currentColor"/>';
  setStatus('running', 'Running…');

  appendSeparator();

  // Timestamp badge
  const out = document.getElementById('output');
  const badge = document.createElement('div');
  const now = new Date();
  badge.innerHTML = `<span style="font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace"># ${now.toLocaleTimeString()}</span>`;
  badge.style.marginBottom = '4px';
  out.appendChild(badge);

  const t0 = performance.now();

  try {
    const resp = await fetch('/run', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: code,
    });

    const data = await resp.json();
    const elapsed = ((performance.now() - t0) / 1000).toFixed(3);

    // Status badge
    const resultBadge = document.createElement('div');
    if (data.success) {
      resultBadge.innerHTML = `<span class="exec-badge ok">✓ Exited successfully &nbsp;·&nbsp; ${elapsed}s</span>`;
    } else {
      resultBadge.innerHTML = `<span class="exec-badge err">✖ Error &nbsp;·&nbsp; ${elapsed}s</span>`;
    }
    out.appendChild(resultBadge);

    if (data.stdout) appendOutput(data.stdout);
    if (data.stderr) appendOutput(data.stderr, 'out-error');
    if (!data.stdout && !data.stderr && data.success) {
      appendOutput('(no output)', 'out-info');
    }

    setStatus(data.success ? 'idle' : 'error', data.success ? 'Done' : 'Error');
  } catch (err) {
    appendOutput('Could not connect to Mako runtime. Is the studio server running?', 'out-error');
    setStatus('error', 'Connection failed');
  }

  btn.classList.remove('running');
  icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  out.scrollTop = out.scrollHeight;
}

// ── File I/O ──────────────────────────────────────────────────

function openFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.mako,.txt';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      if (window.editor) {
        window.editor.setValue(ev.target.result);
        document.getElementById('filename').value = file.name;
        document.getElementById('tab-filename').textContent = file.name;
        if (window.isModified) window.isModified.clear();
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function saveFile() {
  if (!window.editor) return;
  const code = window.editor.getValue();
  const name = document.getElementById('filename').value || 'untitled.mako';
  const blob = new Blob([code], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  if (window.isModified) window.isModified.clear();
  setStatus('idle', `Saved ${name}`);
}

// Sync filename display
document.getElementById('filename').addEventListener('input', function() {
  document.getElementById('tab-filename').textContent = this.value;
});
</script>
</body>
</html>
